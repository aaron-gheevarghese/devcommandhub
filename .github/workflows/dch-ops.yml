name: DevCommandHub Ops (reusable)

# Called from the small .github/workflows/devcommandhub.yml stub that
# "DevCommandHub: Set Up This Repo" adds to a user's repository. Runs in the
# context of the CALLER's repo: builds its services and runs scripts/k8s-ops.sh.
#
# Cluster:
#   - KUBECONFIG secret set in the caller repo -> real cluster, images pushed to GHCR
#   - otherwise -> throwaway kind sandbox cluster on the runner
on:
  workflow_call:
    inputs:
      action: { type: string, required: true }
      service: { type: string, required: false, default: "" }
      environment: { type: string, required: false, default: development }
      replicas: { type: string, required: false, default: "" }
      tail: { type: string, required: false, default: "100" }
      dch_repo: { type: string, required: false, default: aaron-gheevarghese/devcommandhub }
      dch_ref: { type: string, required: false, default: main }
    secrets:
      KUBECONFIG:
        required: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Inputs come from free-text commands: pass them as env vars, never interpolate into scripts.
    env:
      DCH_ACTION: ${{ inputs.action }}
      DCH_SERVICE: ${{ inputs.service }}
      DCH_ENVIRONMENT: ${{ inputs.environment }}
      DCH_REPLICAS: ${{ inputs.replicas }}
      DCH_TAIL: ${{ inputs.tail }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # sandbox rollback deploys the previous commit first

      - name: Checkout DevCommandHub ops scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.dch_repo }}
          ref: ${{ inputs.dch_ref }}
          path: .dch
          sparse-checkout: scripts

      - name: Connect to cluster
        id: cluster
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "No KUBECONFIG secret: using a throwaway kind sandbox cluster"
            echo "mode=sandbox" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.kube
          if printf '%s' "$KUBECONFIG_DATA" | grep -q 'apiVersion'; then
            printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config
          else
            printf '%s' "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          fi
          chmod 600 ~/.kube/config
          echo "mode=cluster" >> "$GITHUB_OUTPUT"

      - name: Create kind sandbox cluster
        if: steps.cluster.outputs.mode == 'sandbox'
        uses: helm/kind-action@v1
        with:
          cluster_name: dch

      - name: Log in to GHCR
        if: steps.cluster.outputs.mode == 'cluster' && (inputs.action == 'deploy' || inputs.action == 'rollback')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run ${{ inputs.action }}
        env:
          MODE: ${{ steps.cluster.outputs.mode }}
          DCH_REPO_ROOT: ${{ github.workspace }}
          DCH_LOG_PREFIX: "1"
        run: |
          if [ "$MODE" = sandbox ]; then
            export KIND_CLUSTER=dch DCH_EPHEMERAL=1
          else
            export DCH_REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"
          fi
          bash .dch/scripts/k8s-ops.sh "$DCH_ACTION" "$DCH_SERVICE" "$DCH_ENVIRONMENT" "$DCH_REPLICAS" "$DCH_TAIL"
