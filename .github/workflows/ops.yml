name: DevCommandHub Ops

# Dispatched by the DevCommandHub backend (src/backend/src/executors/githubActions.ts).
# Spins up a throwaway kind (Kubernetes-in-Docker) cluster on the runner and runs the
# requested operation with scripts/k8s-ops.sh, which issues real kubectl commands.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: DevCommandHub job id
        required: true
      action:
        description: Operation
        required: true
        type: choice
        options: [deploy, rollback, scale, restart, logs, status]
      service:
        description: Service (directory under k8s/)
        required: false
      environment:
        description: Target environment (namespace dch-<environment>)
        required: false
        default: development
      replicas:
        description: Replica count (scale only)
        required: false
      tail:
        description: Log lines (logs only)
        required: false
        default: "100"
      user_id:
        description: DevCommandHub user id
        required: false
      original_command:
        description: Natural-language command
        required: false

# The backend finds this run by the "DCH <job_id> " prefix.
run-name: DCH ${{ inputs.job_id }} - ${{ inputs.action }} ${{ inputs.service }} @ ${{ inputs.environment }}

permissions:
  contents: read

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Inputs come from free-text commands: pass them as env vars, never interpolate into scripts.
    env:
      DCH_JOB_ID: ${{ inputs.job_id }}
      DCH_ACTION: ${{ inputs.action }}
      DCH_SERVICE: ${{ inputs.service }}
      DCH_ENVIRONMENT: ${{ inputs.environment }}
      DCH_REPLICAS: ${{ inputs.replicas }}
      DCH_TAIL: ${{ inputs.tail }}
      DCH_COMMAND: ${{ inputs.original_command }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # rollback bootstraps the previous commit's image

      - name: Job info
        run: |
          echo "Job:         $DCH_JOB_ID"
          echo "Command:     $DCH_COMMAND"
          echo "Action:      $DCH_ACTION"
          echo "Service:     $DCH_SERVICE"
          echo "Environment: $DCH_ENVIRONMENT"
          echo "Replicas:    $DCH_REPLICAS"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: dch

      - name: Run operation
        env:
          KIND_CLUSTER: dch
          DCH_EPHEMERAL: "1"
          DCH_LOG_PREFIX: "1"
        run: bash scripts/k8s-ops.sh "$DCH_ACTION" "$DCH_SERVICE" "$DCH_ENVIRONMENT" "$DCH_REPLICAS" "$DCH_TAIL"
